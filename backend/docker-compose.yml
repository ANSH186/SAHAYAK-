version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://sahayak:sahayak_password@db:5432/sahayak_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PROVIDER=local
      - AI_PROVIDER=mock
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    volumes:
      - .:/app
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: sahayak
      POSTGRES_PASSWORD: sahayak_password
      POSTGRES_DB: sahayak_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahayak -d sahayak_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  upload_data:
